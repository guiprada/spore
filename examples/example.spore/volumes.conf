# Volumes mounted under STORAGE_ROOT, one per line.
#
#   <name>  <spec>  <fstype>  <options|->
#
# spec is UUID=..., LABEL=..., PARTUUID=... or /dev/... for a block device, or
# bind:/path to mount an existing path (how the boot medium gets served without
# exposing it as a raw device).
#
# Prefer UUID or LABEL: /dev/sdb1 renumbers when you plug things in differently,
# and the whole point of a spore is that it produces the same machine every time.
#
# Options '-' means: noatime,nofail plus, on vfat/exfat/ntfs, umask so the
# server can actually write. Those filesystems carry no Unix ownership, so
# permissions come from the mount, not from chown.

# The data partition of the boot stick: the spore itself, the identity, the seed
# overlay, and where the apkovl is committed (see modules/apkovl.conf). ext4
# rather than vfat, so the identity that decrypts every secret can actually be
# mode 0600.
data     LABEL=DATA        ext4   -

archive  LABEL=archive     ext4   -
photos   UUID=A1B2-C3D4    exfat  -
bootusb  bind:/media/usb   -      -
