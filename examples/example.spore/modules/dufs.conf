DUFS_ENABLED=yes
DUFS_SERVE=/media/storage
DUFS_BIND=0.0.0.0
DUFS_PORT=443

# Full read/write/upload. Leave unset for the package's read-only default.
DUFS_ALLOW_ALL=yes

# HTTPS. The certificate is generated on the host at first apply, never carried
# in the spore.
DUFS_TLS_CERT=/etc/dufs/tls/server.crt
DUFS_TLS_KEY=/etc/dufs/tls/server.key
DUFS_TLS_SELFSIGNED=yes

# DUFS_AUTH is a secret: set it on the host, not here.

# Passwords travel sealed, never in cleartext:
#   spore seal dufs-auth   (type the rule, e.g. admin:s3cret@/:rw)
#   DUFS_AUTH_SECRET=dufs-auth
