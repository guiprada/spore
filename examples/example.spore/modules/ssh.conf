# The module default is SSH_ENABLED=no — a machine nobody asked to be reachable
# should not be. This example turns it on deliberately.
#
# spore refuses to enable ssh if the result would be unusable (nothing could log
# in) or dangerous (password-less root exposed to the network).
SSH_ENABLED=yes
SSH_PORT=22
SSH_PERMIT_ROOT_LOGIN=no
SSH_PASSWORD_AUTH=no

# Seal the host keys and a rebuilt box keeps its identity, so clients never see
# REMOTE HOST IDENTIFICATION HAS CHANGED:
#   spore seal ssh_host_ed25519_key /etc/ssh/ssh_host_ed25519_key
#   SSH_HOST_KEY_SECRETS="ssh_host_ed25519_key"
