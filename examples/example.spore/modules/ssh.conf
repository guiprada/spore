SSH_ENABLED=yes
SSH_PORT=22
SSH_PERMIT_ROOT_LOGIN=prohibit-password
SSH_PASSWORD_AUTH=no
SSH_AUTHORIZED_KEYS=keys/authorized_keys

# Seal the host keys and the box keeps its identity across a rebuild, so clients
# never see REMOTE HOST IDENTIFICATION HAS CHANGED:
#   spore seal ssh_host_ed25519_key /etc/ssh/ssh_host_ed25519_key
#   SSH_HOST_KEY_SECRETS="ssh_host_ed25519_key"
