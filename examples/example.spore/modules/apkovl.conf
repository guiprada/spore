# Where `lbu commit` writes the apkovl — the only thing that makes a diskless
# machine remember anything.
#
# A stock Alpine names nowhere: every key in /etc/lbu/lbu.conf ships commented
# out, and setup-lbu is the console step that normally fills one in. A machine
# provisioned unattended never gets that step, so it converges on every boot and
# keeps none of it, with nothing reporting the loss. spore refuses to plan a
# diskless host that names no destination anywhere.
#
# The path has to be on a filesystem that is mounted by the time apply finishes.
# Volumes are mounted in the firstboot pass and committing happens after it, so
# a volume under STORAGE_ROOT works — here, the `data` volume in volumes.conf.
APKOVL_BACKUPDIR=/media/storage/data

# For a partition Alpine already mounted at /media/<name>, name it instead —
# LBU_BACKUPDIR wins over LBU_MEDIA in lbu, so set one or the other, never both.
# APKOVL_MEDIA=data
