REPOS_COMMUNITY=yes
# Point apk's cache at persistent media. Without this a diskless box
# re-downloads every package on every boot.
# On the writable data partition, not the boot medium — the ISO partition can
# stay read-only, which is the point.
REPOS_APK_CACHE=/media/storage/data/cache

# Baked into a seed apkovl so the first boot can install packages unattended.
# Alpine restores /etc/apk/world early in boot, well before local.d could enable
# a repository — so this has to be a file, not a bootstrap script.
REPOS_MIRROR=https://dl-cdn.alpinelinux.org/alpine
REPOS_RELEASE=v3.24
