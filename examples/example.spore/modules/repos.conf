REPOS_COMMUNITY=yes

# Point apk's cache at persistent media, so a diskless box stops re-downloading
# every package on every boot. On the writable data partition, not the boot
# medium — the ISO partition can stay read-only, which is the point.
#
# Left unset here, and it is worth knowing why. The cache has to exist before
# the first `apk add`, so spore sets it up in the bootstrap pass — while volumes
# are mounted in the firstboot pass, much later. A path under STORAGE_ROOT is
# therefore created on the RAM root, and the mount then hides it: apk caches
# into tmpfs and loses it on every reboot. Silently, which is precisely what
# this setting exists to prevent.
#
# So name a path that is already mounted when apply starts — the data partition
# the spore itself was found on — rather than one this spore mounts later:
#
#     REPOS_APK_CACHE=/media/<where the data partition is mounted>/cache
#
# `spore doctor` reports where the cache actually ended up. Mounting a volume
# early enough to be named from here is a design fix not yet made.
