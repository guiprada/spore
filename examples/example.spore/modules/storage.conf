STORAGE_ROOT=/media/storage
# Owner applied to POSIX filesystems only; on vfat/exfat/ntfs it silently
# cannot work, so those get umask instead.
STORAGE_OWNER=dufs:dufs
STORAGE_FAT_UMASK=000
# Numeric only if you set them — busybox mount does not translate names for the
# vfat kernel options, so uid=dufs would be rejected. umask=000 already grants
# access, making these optional.
# STORAGE_FAT_UID=100
# STORAGE_FAT_GID=101
