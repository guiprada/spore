# No accounts unless listed. An account is only reachable over ssh if
# keys/<user>.authorized_keys exists in this spore — spore checks, and refuses to
# enable ssh if nothing could log in.
USERS="gui"

# doas is off unless listed here.
USERS_DOAS="gui"

# `permit persist` prompts for the account's OWN password (doas authenticates
# the invoking user, not the target). adduser -D creates none, so either seal one
# into the spore:
#
#     openssl passwd -6 | spore -s <spore> seal gui.password
#
# which is applied at first boot with nothing typed, or set USERS_DOAS_NOPASS=yes
# and accept that anything running as this user becomes root without
# authenticating.
# USERS_DOAS_NOPASS=yes

# root is never listed in USERS — it already exists — but it is the one account
# that always does, and a stock Alpine boots it with no password. That is fine in
# itself; what is not fine is being reachable in that state. Seal a password the
# same way and it is set in the firstboot pass, which runs before any service is
# enabled:
#
#     openssl passwd -6 | spore -s <spore> seal root.password
#
# ssh counts that when deciding whether enabling sshd would expose a
# password-less root, so it is what makes SSH_PERMIT_ROOT_LOGIN=yes with password
# auth something spore will agree to build.
