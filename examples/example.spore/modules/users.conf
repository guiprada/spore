# No accounts unless listed. An account is only reachable over ssh if
# keys/<user>.authorized_keys exists in this spore — spore checks, and refuses to
# enable ssh if nothing could log in.
USERS="gui"

# doas is off unless listed here.
USERS_DOAS="gui"

# `permit persist` prompts for the account's OWN password (doas authenticates
# the invoking user, not the target). adduser -D creates none, so either seal one
# into the spore:
#
#     openssl passwd -6 | spore -s <spore> seal gui.password
#
# which is applied at first boot with nothing typed, or set USERS_DOAS_NOPASS=yes
# and accept that anything running as this user becomes root without
# authenticating.
# USERS_DOAS_NOPASS=yes
