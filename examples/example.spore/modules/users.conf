# No accounts unless listed. An account is only reachable over ssh if
# keys/<user>.authorized_keys exists in this spore — spore checks, and refuses to
# enable ssh if nothing could log in.
USERS="gui"

# doas is off unless listed here.
USERS_DOAS="gui"

# `permit persist` prompts for the account's password. adduser -D creates none,
# so give the account a password on the host, or set USERS_DOAS_NOPASS=yes and
# accept that anything running as this user becomes root without authenticating.
# USERS_DOAS_NOPASS=yes
