# FW_IFACE is unset on purpose: it follows NET_IFACE, so the zone cannot end up
# naming an interface the machine does not have while net names the one it does.
# A zone that matches nothing drops nothing, and the box reports a firewall it
# has not got.
# Opt-in on purpose: activating a firewall on a remote box can lock you out.
FW_ACTIVATE=no
