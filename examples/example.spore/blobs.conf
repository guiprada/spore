# Binaries apk does not carry. Referenced by url + sha256, never carried inside
# the spore, so the spore stays text-only and small enough to keep moving.
#
# <name>  <arch>  <url>  <sha256>  <dest>  <mode>  <member-in-archive|->
#
# Nothing here: dufs turned out to be packaged in Alpine community, so it is an
# ordinary `apk add`. This mechanism is for things that genuinely are not
# packaged. Prefer a package every time — you inherit its init script,
# its user, and its upgrades.
